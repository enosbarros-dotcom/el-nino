name: deploy-agent

on:
  push:
    branches: [main]
    paths:
      - 'app_el_nino.py'
      - 'favicon.svg'
      - 'saida/facts.json'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'infra/main.bicep'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/el-nino-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Provisiona/atualiza toda a infraestrutura (idempotente)
      - name: Provisionar infraestrutura
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file infra/main.bicep \
            --parameters image=${{ env.IMAGE }}:${{ github.sha }} \
            --query properties.outputs -o json

      # Garante que a replica use exatamente a imagem recem-construida
      - name: Publicar nova revisao
        run: |
          az containerapp update \
            --name elnino-agent \
            --resource-group ${{ vars.AZURE_RG }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --query properties.latestRevisionName -o tsv
